<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Saledock B2B Product Data Skimmer &amp; Importer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 360px;
      margin: 0;
      padding: 14px;
      background: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 14px;
      margin: 0;
      color: #38bdf8;
    }
    .subtext {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 10px;
    }
    .badge {
      display: inline-block;
      background: #0369a1;
      color: #e0f2fe;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .row > div {
      flex: 1;
    }
    input[type="text"], input[type="number"], select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 4px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #f8fafc;
      font-size: 12px;
      margin-bottom: 6px;
    }
    .hint {
      font-size: 10px;
      color: #94a3b8;
      margin-top: -4px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 5px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .btn-primary { background: #0284c7; color: #fff; }
    .btn-primary:hover { background: #0369a1; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-slate { background: #475569; color: #f8fafc; }
    .btn-slate:hover { background: #64748b; }
    .btn-amber { background: #d97706; color: #fff; }
    .btn-amber:hover { background: #b45309; }
    .btn-danger { background: #334155; color: #cbd5e1; }
    .btn-danger:hover { background: #dc2626; color: #fff; }
    #previewBox {
      font-size: 11px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 6px 8px;
      color: #e2e8f0;
      margin-bottom: 8px;
      display: none;
    }
    #status {
      font-size: 11px;
      color: #a7f3d0;
      min-height: 16px;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>Saledock B2B Skimmer &amp; Importer</h1>
  <div class="subtext">v1.0.2 (Build 2026.11.15.4) &bull; MIT Open Source</div>
  <div id="siteBadge" class="badge">Detecting active supplier portal...</div>

  <div class="card">
    <label for="supplierName">Supplier Label (Auto-detected if blank)</label>
    <input type="text" id="supplierName" placeholder="Auto-detect from website" />

    <div class="row">
      <div>
        <label for="defaultPackQty">Pack Override</label>
        <input type="number" id="defaultPackQty" value="1" min="1" />
      </div>
      <div>
        <label for="marginMode">Missing-RRP Markup</label>
        <select id="marginMode">
          <option value="recommended" selected>Auto Tier (33%–56%)</option>
          <option value="custom">Custom % on Cost+VAT</option>
        </select>
      </div>
    </div>

    <div id="customMarginWrap" style="display:none;">
      <label for="customMarginPct">Custom Markup % (Added to Net + 20% VAT)</label>
      <input type="number" id="customMarginPct" value="45" min="1" max="300" step="1" />
    </div>
    <div class="hint" id="tierHint">Tiers: &lt;£3: 56% | £3–£10: 50% | £10–£30: 42% | £30–£75: 36% | £75+: 33%</div>

    <div id="previewBox"></div>

    <button id="btnSkimPage" class="btn-primary">Skim Active B2B Catalogue Tab</button>
    <button id="btnExportCsv" class="btn-success">Export Saledock CSV (<span id="itemCount">0</span>)</button>
    <button id="btnExportAudit" class="btn-slate">Export Pricing &amp; Pack Audit Log (<span id="auditCount">0</span>)</button>
  </div>

  <div class="card">
    <label>Saledock Back-Office Automation</label>
    <button id="btnRunOospMacro" class="btn-amber">Run OOSP &amp; Publish Macro on Saledock Tab</button>
  </div>

  <button id="btnClear" class="btn-danger">Clear Skimmed Queue</button>
  <div id="status">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
